[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --disable-warnings

markers =
    slow: 耗时较长的集成测试（使用 -m "not slow" 排除）
    integration: 集成测试，测试多组件交互
    e2e: 端到端测试，模拟完整用户流程
    unit: 单元测试，测试单一函数/类
    stability: 边界条件稳定性测试
    数学: 数学形式化验证 (invariants, bounds, properties)
    benchmark: 性能基准测试（不用于 CI）
