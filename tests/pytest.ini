[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --disable-warnings

markers =
    slow: 耗时较长的集成测试（使用 -m "not slow" 排除）
    integration: 集成测试，测试多组件交互
    e2e: 端到端测试，模拟完整用户流程
    unit: 单元测试，测试单一函数/类
    stability: 边界条件稳定性测试
    数学: 数学形式化验证 (invariants, bounds, properties)
    benchmark: 性能基准测试（不用于 CI）
    # v1.3 STANDARD: Phase 0/1/2 markers (per plan: 2026-06-08-hilbert-vit-v13-phase0.md)
    static_guard: 8 静态代码守卫 (CI-blocking pre-PoC gate, per v1.3 §9.6)
    phase0: Phase 0 — 数学形式化 + CI-blocking 基础设施
    phase1: Phase 1 — Multi-Block HMFT + Polar Voronoi + 集成
    phase2: Phase 2 — EAHBP + 3-gate + Paced Window
