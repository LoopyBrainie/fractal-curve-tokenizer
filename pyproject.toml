[project]
name = "fractal-curve-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "einops>=0.7.0",
    "gradio>=6.2.0",
    "manim>=0.18.1",
    "manimgl>=1.7.2",
    "mypy>=1.19.0",
    "opencv-python>=4.11.0.86",
    "nvidia-ml-py>=3.0.0",
    "pytest>=8.4.1",
    "pytest-runner>=6.0.1",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "wandb>=0.21.1",
    "entmax>=1.3",
    "datasets>=4.8.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "stability: marks tests for stability verification",
    "数学: marks tests for mathematical verification",
    "benchmark: marks tests as benchmarks (not for CI)",
    # v1.3 STANDARD: Phase 0/1/2 markers (per plan: 2026-06-08-hilbert-vit-v13-phase0.md)
    "static_guard: 8 静态代码守卫 (CI-blocking pre-PoC gate, per v1.3 §9.6)",
    "phase0: Phase 0 — 数学形式化 + CI-blocking 基础设施",
    "phase1: Phase 1 — Multi-Block HMFT + Polar Voronoi + 集成",
    "phase2: Phase 2 — EAHBP + 3-gate + Paced Window",
]
