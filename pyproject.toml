[project]
name = "fractal-curve-tokenizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.11"
dependencies = [
    "einops>=0.7.0",
    "gradio>=6.2.0",
    "manim>=0.18.1",
    "manimgl>=1.7.2",
    "mypy>=1.19.0",
    "opencv-python>=4.11.0.86",
    "pytest>=8.4.1",
    "pytest-runner>=6.0.1",
    "seaborn>=0.13.2",
    "shapely>=2.1.2",
    "torch==2.4.0",
    "torchvision==0.19.0",
    "wandb>=0.21.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "stability: marks tests for stability verification",
    "数学: marks tests for mathematical verification",
    "benchmark: marks tests as benchmarks (not for CI)",
]
