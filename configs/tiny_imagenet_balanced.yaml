# Tiny-ImageNet 类别平衡训练配置
# ================================
# 解决尾部类别 0% 准确率问题
#
# 数学形式化:
# - 采样: P(sample i) ∝ 1/n_{c_i}^β, β=0.9
# - 损失: L = -α_c · (1-p_c)^γ · log(p_c), γ=2.0
# - 预算: L_budget = λ · ReLU(FLOPS/Budget - 1)²

base: base.yaml

name: tiny_imagenet_class_balanced
description: "Class-balanced training for Tiny-ImageNet with tail class focus"

# 类别平衡采样
data:
  sampler_type: class_balanced
  sampler_beta: 0.9  # 强类别平衡 (接近逆频率)

# Focal + Class-Balanced Loss
loss:
  type: focal_cb
  focal_gamma: 2.0   # Focal Loss 难样本权重
  cb_beta: 0.9999    # Class-Balanced 有效样本数

# 启用 FLOPS 预算
budget:
  enabled: true
  type: flops
  flops_budget: 5000000000   # 5 GFLOPS
  flops_lambda: 0.1
  schedule: cosine
  budget_max_ratio: 1.5  # 初始宽松
  budget_min_ratio: 0.8  # 最终收紧

# 稍长训练以适应新损失
training:
  num_epochs: 120
  patience: 25

# 启用 W&B 记录
wandb:
  enabled: true
  project: fractal-vit
  tags:
    - class-balanced
    - focal-loss
    - flops-budget
